name: Docker Publish

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/acr-cli

jobs:
  build-and-push:
    name: Build and Publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        env:
          GHCR_REGISTRY: ${{ env.REGISTRY }}
          GHCR_USERNAME: ${{ github.repository_owner }}
          GHCR_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ATTEMPTS=5
          for attempt in $(seq 1 "$ATTEMPTS"); do
            echo "Attempt ${attempt}/${ATTEMPTS} to log in to ${GHCR_REGISTRY} as ${GHCR_USERNAME}" >&2
            if echo "${GHCR_PASSWORD}" | docker login "${GHCR_REGISTRY}" -u "${GHCR_USERNAME}" --password-stdin; then
              exit 0
            fi

            if [ "${attempt}" -lt "${ATTEMPTS}" ]; then
              SLEEP_DURATION=$((attempt * 5))
              echo "Login failed, retrying in ${SLEEP_DURATION}s..." >&2
              sleep "${SLEEP_DURATION}"
            fi
          done

          echo "Docker login to ${GHCR_REGISTRY} failed after ${ATTEMPTS} attempts" >&2
          exit 1

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=ref,event=pr
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          platforms: linux/amd64,linux/arm64
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
